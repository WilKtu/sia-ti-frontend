<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incidentes · SIA TI</title>
  <meta name="description" content="Gestión de incidentes TI">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div id="navbar-root"></div>

  <main class="container" id="contenido">
    <header class="page-header">
      <div>
        <h1 class="page-header__title">Incidentes</h1>
        <p class="page-header__subtitle">Registre, filtre y de seguimiento a los incidentes de TI.</p>
      </div>
      <div class="page-header__actions">
        <button type="button" class="btn btn-primary" id="btn-new">＋ Nuevo incidente</button>
      </div>
    </header>

    <section class="card section" aria-label="Filtros de incidentes">
      <form id="filters-form" class="toolbar" novalidate>
        <div class="form-group toolbar__search">
          <label class="form-label" for="f-search">Buscar</label>
          <input class="input" type="search" id="f-search" name="search" placeholder="Título, descripción o ID" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="f-status">Estado</label>
          <select class="select" id="f-status" name="status"><option value="">Todos</option></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-category">Categoría</label>
          <select class="select" id="f-category" name="categoryId"><option value="">Todas</option></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-priority">Prioridad</label>
          <select class="select" id="f-priority" name="priority"><option value="">Todas</option></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-from">Desde</label>
          <input class="input" type="date" id="f-from" name="from">
        </div>
        <div class="form-group">
          <label class="form-label" for="f-to">Hasta</label>
          <input class="input" type="date" id="f-to" name="to">
          <span class="form-error" id="f-range-error" role="alert"></span>
        </div>
        <div class="toolbar__actions">
          <button type="button" class="btn btn-secondary" id="btn-clear">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="section" aria-live="polite" aria-label="Listado de incidentes">
      <div id="incidents-table"></div>
    </section>
  </main>

  <footer class="footer">SIA TI · Sistema inteligente de análisis de incidentes tecnológicos</footer>

  <script type="module" src="js/pages/incidentes.js"></script>
</body>
</html>
